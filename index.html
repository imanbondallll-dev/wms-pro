
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#082c50">
  <title>Bondall WMS Enterprise</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #082c50;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .panel {
      padding: 32px;
    }

    .loader {
      width: 42px;
      height: 42px;
      margin: 0 auto 20px;
      border: 4px solid #ffffff40;
      border-top-color: #e31b32;
      border-right-color: #d9ad43;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h2 { margin: 0; letter-spacing: 1px; }
    p { color: #d5e4f2; font-size: 14px; }

    a {
      color: #f0c45b;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="panel">
    <div class="loader"></div>
    <h2>BONDALL WMS</h2>
    <p>Menghubungkan ke WMS Enterprise...</p>
    <p id="status">Mohon tunggu sebentar.</p>
    <noscript>
      <p>
        <a href="https://script.google.com/macros/s/AKfycbw60JPPywaKWqKoiEqHeVi9MAJGxYfCSlEjWTIEWy_xu-ur_4wZOCpUfPmkTdevo60b/exec">
          Buka WMS Enterprise
        </a>
      </p>
    </noscript>
  </main>

  <script>
    const WMS_URL =
      "https://script.google.com/macros/s/AKfycbw60JPPywaKWqKoiEqHeVi9MAJGxYfCSlEjWTIEWy_xu-ur_4wZOCpUfPmkTdevo60b/exec";

    document.getElementById("status").textContent =
      "Membuka aplikasi WMS...";

    window.location.replace(WMS_URL);
  </script>
</body>
</html>
