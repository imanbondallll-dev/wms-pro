
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#082c50">

  <title>WMS Enterprise - Bondall</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #edf3f9;
      font-family: Arial, sans-serif;
    }

    #wmsFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #082c50;
      color: white;
      text-align: center;
    }

    .loader {
      width: 42px;
      height: 42px;
      margin: 0 auto 18px;
      border: 4px solid rgba(255,255,255,.25);
      border-top-color: #e31b32;
      border-right-color: #d9ad43;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 13px;
      color: #c8d9eb;
    }
  </style>
</head>

<body>

  <div id="loading">
    <div>
      <div class="loader"></div>
      <div class="brand">BONDALL WMS</div>
      <p class="subtitle">Menghubungkan ke WMS Enterprise...</p>
    </div>
  </div>

  <iframe
    id="wmsFrame"
    title="WMS Enterprise Bondall"
    src="https://script.google.com/macros/s/AKfycbw60JPPywaKWqKoiEqHeVi9MAJGxYfCSlEjWTIEWy_xu-ur_4wZOCpUfPmkTdevo60b/exec"
    allow="clipboard-read; clipboard-write"
    allowfullscreen>
  </iframe>

  <script>
    const frame = document.getElementById("wmsFrame");
    const loading = document.getElementById("loading");

    frame.addEventListener("load", function () {
      loading.style.display = "none";
    });
  </script>

</body>
</html>
